name: ALDI TALK Auto Reload

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencies installieren
        run: npm ci

      - name: TypeScript bauen
        run: npm run build
      - name: Alte Session herunterladen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p session-download
          gh run download --name alditalk-session --dir session-download || true

      - name: Session entschlüsseln
        continue-on-error: true
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: |
          if [ -f session-download/browser-profile.tar.gz.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in session-download/browser-profile.tar.gz.enc \
              -out browser-profile.tar.gz \
              -pass env:SESSION_KEY

            tar -xzf browser-profile.tar.gz
          fi
      - name: ALDI TALK prüfen
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: node dist/index.js
              - name: Browser-Session verschlüsseln
        if: always()
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: |
          if [ -d browser-profile ]; then
            tar -czf browser-profile.tar.gz browser-profile

            openssl enc -aes-256-cbc -salt -pbkdf2 \
              -in browser-profile.tar.gz \
              -out browser-profile.tar.gz.enc \
              -pass env:SESSION_KEY
          fi

      - name: Browser-Session speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alditalk-session
          path: browser-profile.tar.gz.enc
          retention-days: 7
          overwrite: true
