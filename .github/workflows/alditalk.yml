name: ALDI TALK Auto Reload

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alditalk-auto-reload
  cancel-in-progress: false

jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencies installieren
        run: npm ci

      - name: TypeScript bauen
        run: npm run build

      - name: Alte Browser-Session herunterladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p session-download

          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts
            | map(select(.name == "alditalk-session" and .expired == false))
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty')

          if [ -n "$ARTIFACT_ID" ]; then
            echo "Gespeicherte Session gefunden."

            gh api \
              "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
              > session.zip

            unzip -o session.zip -d session-download
          else
            echo "Noch keine gespeicherte Session vorhanden."
          fi

      - name: Browser-Session wiederherstellen
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: |
          if [ -f session-download/browser-profile.tar.gz.enc ]; then
            echo "Entschlüssele Browser-Session..."

            openssl enc \
              -d \
              -aes-256-cbc \
              -pbkdf2 \
              -in session-download/browser-profile.tar.gz.enc \
              -out browser-profile.tar.gz \
              -pass env:SESSION_KEY

            tar -xzf browser-profile.tar.gz

            echo "Browser-Session wiederhergestellt."
          else
            echo "Keine bestehende Session zum Wiederherstellen."
          fi

      - name: ALDI TALK prüfen
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SMS_CODE: ${{ secrets.SMS_CODE }}
        run: node dist/index.js

      - name: Browser-Session verschlüsseln
        if: always()
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: |
          if [ -d browser-profile ]; then
            echo "Speichere Browser-Profil..."

            tar -czf browser-profile.tar.gz browser-profile

            openssl enc \
              -aes-256-cbc \
              -salt \
              -pbkdf2 \
              -in browser-profile.tar.gz \
              -out browser-profile.tar.gz.enc \
              -pass env:SESSION_KEY

            echo "Browser-Session verschlüsselt."
          else
            echo "Kein Browser-Profil vorhanden."
          fi

      - name: Browser-Session speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alditalk-session
          path: browser-profile.tar.gz.enc
          if-no-files-found: ignore
          retention-days: 7
